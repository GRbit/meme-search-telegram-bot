version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    sloglint:
      kv-only: true
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/grbit/meme-search-telegram-bot
