# meme-search-telegram-bot config file. Copy to config.yml (in Docker: mount it as /config/config.yml).
# Precedence: built-in defaults -> this file -> environment variables. Env vars override the file.
# Commented-out keys keep their defaults; a key set to "" is an explicit empty value.
# The matching env var is named in each comment; see .env.example for the long explanations.

telegram:
  bot_token: ""            # TELEGRAM_BOT_TOKEN, required, from @BotFather

meme_search:
  url: ""                  # MEME_SEARCH_URL, required, e.g. http://meme_search:3000
  api_token: ""            # MEME_SEARCH_API_TOKEN, required, scopes search:read,media:read (+ media:write for uploads)
  timeout: 30s             # MEME_SEARCH_TIMEOUT, request timeout to the meme-search API

search:
  results_per_page: 5      # RESULTS_PER_PAGE
  results_memory_limit: 20000 # RESULTS_MEMORY_LIMIT, memes kept for "More" over all searches (min 20); ~0.5-1 KB each, 20000 = 10-20 MB
  mode: vector             # SEARCH_MODE: vector or keyword
  inline_results: 3        # INLINE_RESULTS, memes per inline query, 1-20
  inline_debounce: 1s      # INLINE_DEBOUNCE, wait for the user to stop typing, max 5s; 0 disables
  inline_group_scope: ""   # INLINE_GROUP_SCOPE, default filters for inline in groups, e.g. "#reaction #work"

cache:
  # chat_id:              # CACHE_CHAT_ID, private channel id like -1001234567890; empty = inline off
  # library_dir:          # LIBRARY_DIR, default = saver.dir
  warmup_interval: 6h      # WARMUP_INTERVAL
  feed_interval: 1m        # FEED_INTERVAL, change feed polling (servers with the meme listing only)
  uploads_per_min: 20      # CACHE_UPLOADS_PER_MIN
  warmup_uploads_per_min: 10   # WARMUP_UPLOADS_PER_MIN

saver:
  # dir:                  # SAVE_DIR, default memes/ next to the executable
  mode: per_user           # SAVE_MODE: per_user (folder per user), single (one folder) or nested (folder/<user>)
  folder: telegram         # SAVE_FOLDER, the folder of single mode, the parent of nested mode
  dir_prefix: tg-          # SAVE_DIR_PREFIX, per_user mode only
  note: ""                 # SAVE_NOTE, appended to the "Saved" reply
  backend: folder          # SAVE_BACKEND: folder (write files) or api (upload API, files as fallback)

access:
  save_user_ids: []        # SAVE_USER_IDS, e.g. [111111, 222222]; also trusted
  trusted_user_ids: []     # TRUSTED_USER_IDS, unlimited search
  public_daily_per_user: 5 # PUBLIC_DAILY_PER_USER, 0 disables public search
  public_daily_total: 120  # PUBLIC_DAILY_TOTAL
  inline_charge_window: 10s  # INLINE_CHARGE_WINDOW
  admin_contact: ""        # ADMIN_CONTACT, e.g. "@your_username"

default_lang: en           # DEFAULT_LANG
tz: UTC                    # TZ
# db_path:                # DB_PATH, default data/bot.db next to the executable
log_level: info            # LOG_LEVEL
